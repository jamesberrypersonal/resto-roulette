[package]
name = "resto-roulette"
version = "0.1.0"
edition = "2021"
description = "Random restaurant picker from your Google Maps saved list, bucketed by travel time"
license = "MIT"

[[bin]]
name = "resto-roulette"
path = "src/main.rs"

[lib]
name = "resto_roulette"
path = "src/lib.rs"

[dependencies]
clap               = { version = "4", features = ["derive", "env"] }
reqwest            = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
csv                = "1"
rusqlite           = { version = "0.31", features = ["bundled"] }
tokio              = { version = "1", features = ["full"] }
rand               = "0.8"
thiserror          = "2"
sha2               = "0.10"
hex                = "0.4"
chrono             = { version = "0.4", features = ["serde"] }
colored            = "2"
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
toml               = "0.8"
dirs               = "6"
futures            = "0.3"
anyhow             = "1"

[dev-dependencies]
wiremock  = "0.6"
proptest  = "1"
tempfile  = "3"
tokio     = { version = "1", features = ["full"] }
